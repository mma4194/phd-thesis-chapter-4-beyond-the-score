name: Package and software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_package.py
      - run: python -m pip install -r requirements-checks.txt
      - run: python tools/check_environment.py --group public
      - run: python -m unittest discover -s tests -v
# This job checks integrity and software contracts. It does not run or certify the full experiments.
